<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>RS — Red Shirt AI</title>
    <style>
        /* ── RESET & BASE ───────────────────────────────── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #080808;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── HEADER ─────────────────────────────────────── */
        .header {
            background: linear-gradient(135deg, #1a0000, #2d0000);
            border-bottom: 2px solid #dc1e1e;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rs-logo {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #ff2222, #8b0000);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 0 15px rgba(220,30,30,0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 15px rgba(220,30,30,0.6); }
            50%       { box-shadow: 0 0 30px rgba(220,30,30,0.9); }
        }

        .header-title { font-size: 18px; font-weight: 700; }
        .header-title span { color: #dc1e1e; }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22dc22;
            box-shadow: 0 0 8px #22dc22;
            animation: blink 1.5s infinite;
        }

        .status-dot.offline { background: #dc2222; box-shadow: 0 0 8px #dc2222; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        /* ── CHAT AREA ──────────────────────────────────── */
        .chat-area {
            padding: 16px;
            height: calc(100vh - 180px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-track { background: #111; }
        .chat-area::-webkit-scrollbar-thumb { background: #dc1e1e; border-radius: 2px; }

        /* ── MESSAGES ───────────────────────────────────── */
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: linear-gradient(135deg, #8b0000, #dc1e1e);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.rs {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #eee;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.rs .rs-label {
            color: #dc1e1e;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .message.system {
            background: #111;
            border: 1px solid #dc1e1e33;
            color: #888;
            align-self: center;
            font-size: 12px;
            text-align: center;
            border-radius: 20px;
            padding: 6px 14px;
        }

        /* ── TYPING INDICATOR ───────────────────────────── */
        .typing {
            display: none;
            align-self: flex-start;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            padding: 12px 16px;
        }

        .typing.show { display: flex; gap: 4px; align-items: center; }

        .typing span {
            width: 8px;
            height: 8px;
            background: #dc1e1e;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30%            { transform: translateY(-8px); }
        }

        /* ── QUICK COMMANDS ─────────────────────────────── */
        .quick-commands {
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .quick-commands::-webkit-scrollbar { display: none; }

        .quick-btn {
            background: #1a0000;
            border: 1px solid #dc1e1e55;
            color: #dc1e1e;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:active {
            background: #dc1e1e;
            color: #fff;
            transform: scale(0.95);
        }

        /* ── INPUT AREA ─────────────────────────────────── */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            border-top: 1px solid #333;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-box {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 24px;
            padding: 12px 18px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        .input-box:focus { border-color: #dc1e1e; }
        .input-box::placeholder { color: #555; }

        .send-btn {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #8b0000, #dc1e1e);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            box-shadow: 0 0 15px rgba(220,30,30,0.4);
        }

        .send-btn:active { transform: scale(0.9); }

        .mic-btn {
            width: 46px;
            height: 46px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 50%;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .mic-btn.listening {
            background: #dc1e1e22;
            border-color: #dc1e1e;
            color: #dc1e1e;
            animation: pulse 1s infinite;
        }

        /* ── WELCOME CARD ───────────────────────────────── */
        .welcome-card {
            background: linear-gradient(135deg, #1a0000, #0d0000);
            border: 1px solid #dc1e1e33;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin: 8px 0;
        }

        .welcome-card .big-logo {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ff2222, #8b0000);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
            margin: 0 auto 12px;
            box-shadow: 0 0 30px rgba(220,30,30,0.5);
        }

        .welcome-card h2 { font-size: 20px; margin-bottom: 6px; }
        .welcome-card h2 span { color: #dc1e1e; }
        .welcome-card p { color: #888; font-size: 13px; line-height: 1.6; }
    </style>
</head>
<body>

<!-- ── HEADER ────────────────────────────────────────────── -->
<div class="header">
    <div class="header-left">
        <div class="rs-logo">RS</div>
        <div class="header-title">R.S. <span>RED SHIRT</span></div>
    </div>
    <div class="status-dot" id="statusDot"></div>
</div>

<!-- ── CHAT AREA ─────────────────────────────────────────── -->
<div class="chat-area" id="chatArea">

    <!-- Welcome card -->
    <div class="welcome-card">
        <div class="big-logo">RS</div>
        <h2>R.S. <span>Red Shirt</span></h2>
        <p>Your personal AI assistant is ready.<br>
           Type a command or ask anything.<br>
           RS will execute it on your PC.</p>
    </div>

    <!-- Typing indicator -->
    <div class="typing" id="typing">
        <span></span><span></span><span></span>
    </div>

</div>

<!-- ── QUICK COMMANDS ─────────────────────────────────────── -->
<div class="quick-commands">
    <button class="quick-btn" onclick="sendQuick('time')">⏰ Time</button>
    <button class="quick-btn" onclick="sendQuick('date')">📅 Date</button>
    <button class="quick-btn" onclick="sendQuick('open chrome')">🌐 Chrome</button>
    <button class="quick-btn" onclick="sendQuick('open spotify')">🎵 Spotify</button>
    <button class="quick-btn" onclick="sendQuick('open whatsapp')">💬 WhatsApp</button>
    <button class="quick-btn" onclick="sendQuick('screenshot')">📸 Screenshot</button>
    <button class="quick-btn" onclick="sendQuick('stats')">📊 Stats</button>
    <button class="quick-btn" onclick="sendQuick('memory')">🧠 Memory</button>
</div>

<!-- ── INPUT AREA ─────────────────────────────────────────── -->
<div class="input-area">
    <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
    <input
        class="input-box"
        id="inputBox"
        type="text"
        placeholder="Give RS a command..."
        onkeydown="if(event.key==='Enter') sendMessage()"
    />
    <button class="send-btn" onclick="sendMessage()">➤</button>
</div>

<script>
    // ── SERVER URL ────────────────────────────────────────
    // This automatically uses whatever server served this page
    const SERVER = window.location.origin;

    // ── DOM ELEMENTS ──────────────────────────────────────
    const chatArea  = document.getElementById('chatArea');
    const inputBox  = document.getElementById('inputBox');
    const typing    = document.getElementById('typing');
    const statusDot = document.getElementById('statusDot');
    const micBtn    = document.getElementById('micBtn');

    // ── STATUS CHECK ──────────────────────────────────────
    async function checkStatus() {
        try {
            const r = await fetch(`${SERVER}/ping`);
            if (r.ok) {
                statusDot.classList.remove('offline');
            } else {
                statusDot.classList.add('offline');
            }
        } catch {
            statusDot.classList.add('offline');
        }
    }

    // Check status every 10 seconds
    checkStatus();
    setInterval(checkStatus, 10000);

    // ── ADD MESSAGE TO CHAT ───────────────────────────────
    function addMessage(text, type) {
        // Remove typing indicator temporarily
        typing.classList.remove('show');

        const msg = document.createElement('div');
        msg.className = `message ${type}`;

        if (type === 'rs') {
            msg.innerHTML = `<div class="rs-label">RS</div>${text}`;
        } else {
            msg.textContent = text;
        }

        // Insert before typing indicator
        chatArea.insertBefore(msg, typing);

        // Scroll to bottom
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // ── SEND MESSAGE ──────────────────────────────────────
    async function sendMessage() {
        const text = inputBox.value.trim();
        if (!text) return;

        // Show user message
        addMessage(text, 'user');
        inputBox.value = '';

        // Show typing indicator
        typing.classList.add('show');
        chatArea.scrollTop = chatArea.scrollHeight;

        try {
            const response = await fetch(`${SERVER}/chat`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ message: text })
            });

            const data = await response.json();
            typing.classList.remove('show');

            if (data.response) {
                addMessage(data.response, 'rs');
            } else if (data.error) {
                addMessage(`Error: ${data.error}`, 'system');
            }

        } catch (err) {
            typing.classList.remove('show');
            addMessage('Could not reach RS. Is the server running?', 'system');
        }
    }

    // ── QUICK COMMANDS ────────────────────────────────────
    function sendQuick(command) {
        inputBox.value = command;
        sendMessage();
    }

    // ── VOICE INPUT ───────────────────────────────────────
    let recognition = null;
    let isListening = false;

    function toggleMic() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            addMessage('Voice not supported in this browser. Use Chrome.', 'system');
            return;
        }

        if (isListening) {
            recognition.stop();
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = false;

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            micBtn.textContent = '🔴';
            addMessage('Listening...', 'system');
        };

        recognition.onresult = (e) => {
            const text = e.results[0][0].transcript;
            inputBox.value = text;
            sendMessage();
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.textContent = '🎤';
        };

        recognition.onerror = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.textContent = '🎤';
        };

        recognition.start();
    }

    // ── FOCUS INPUT ON LOAD ───────────────────────────────
    window.onload = () => {
        inputBox.focus();
        addMessage('RS is online and ready. What can I do for you?', 'rs');
    };
</script>

</body>
</html>
